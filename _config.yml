title: AI/ML/DS Conference Deadlines 4 Africans # 
# email: vukosi.marivate@cs.up.ac.za
description: Countdowns to AI/ML/DS conference/workshop/event deadlines on the African continent
author: Mpho Mokoatle, Avashlin Moodley, Vukosi Marivate

domain: "mldsafrica.co.za"

# GitHub Pages and custom domain configuration
# For custom domain (mldsafrica.co.za): url should be the custom domain, baseurl should be empty
# For GitHub Pages (abdulrasaqzainab.github.io/deadlines): Jekyll will auto-detect the repo name
url: "https://mldsafrica.co.za"
baseurl: ""

# GitHub Pages will automatically set baseurl to "/deadlines" when serving from github.io
# The relative_url filter handles both cases automatically
# Force rebuild: 2025-10-29-v2

twitter_username: 
twitter_hashtag: africanmachinelearning
github_username: dsfsi
github_repo: deadlines

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
ga_id: UA-137561504-1

# Jekyll will automatically include assets directory
# But we'll be explicit about what to include and exclude
include: ['_pages']

# Exclude files/directories not needed in the final site
exclude: 
  - 'static'
  - 'utils'
  - 'venv'
  - '.qodo'
  - 'pr7_repo'
  - 'check_deadlines.py'
  - 'find_missing_deadlines.sh'
  - 'test.html'
  - 'Gemfile*'
  - '.travis.yml'

# Ensure assets are properly handled
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# Plugin configuration
plugins:
  - jekyll-sitemap
