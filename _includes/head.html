<meta charset="utf-8">
<!-- Force rebuild to fix asset paths - 2025-10-29-v3 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ site.author }}">

<!-- Bootstrap CSS from CDN as fallback -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/static/css/deadlines.css?t={{site.time | date: '%s'}}" media="screen,projection">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/static/css/calendar.css">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/static/css/js-year-calendar.min.css">

<!-- Bootstrap multiselect CSS -->
<!-- Prefer local multiselect CSS (falls back to CDN only if missing) -->
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/static/css/bootstrap-multiselect.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-multiselect@1.1.2/dist/css/bootstrap-multiselect.css'">

<link rel="shortcut icon" href="{{ site.baseurl }}/static/img/favicon.png">

<!-- jQuery and Bootstrap from CDN -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Use local bootstrap-multiselect plugin (compatible with this repo) -->
<script src="{{ site.baseurl }}/static/js/bootstrap-multiselect.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap-multiselect@1.1.2/dist/js/bootstrap-multiselect.min.js'"></script>

<!-- Moment.js for timezone handling -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>

<!-- Local scripts (served from repo 'static' directory) -->
<script type="text/javascript" src="{{ site.baseurl }}/static/js/jquery.countdown.min.js"></script>
<script src="{{ site.baseurl }}/static/js/store.min.js"></script>
<script src="{{ site.baseurl }}/static/js/ouical.min.js"></script>
<script src="{{ site.baseurl }}/static/js/js-year-calendar.js"></script>
