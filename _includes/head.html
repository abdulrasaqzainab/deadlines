<meta charset="utf-8">
<!-- Force rebuild to fix asset paths - 2025-10-29-v2 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ site.author }}">

<!-- Bootstrap CSS from CDN as fallback -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Debug: {{ '/assets/css/deadlines.css' | relative_url }} -->
{% if site.github.environment == 'dotcom' %}
<link rel="stylesheet" type="text/css" href="/deadlines/assets/css/deadlines.css?t={{site.time | date: '%s'}}" media="screen,projection">
<link rel="stylesheet" type="text/css" href="/deadlines/assets/css/calendar.css">
<link rel="stylesheet" type="text/css" href="/deadlines/assets/css/js-year-calendar.min.css">
{% else %}
<link rel="stylesheet" type="text/css" href="/assets/css/deadlines.css?t={{site.time | date: '%s'}}" media="screen,projection">
<link rel="stylesheet" type="text/css" href="/assets/css/calendar.css">
<link rel="stylesheet" type="text/css" href="/assets/css/js-year-calendar.min.css">
{% endif %}

<!-- Bootstrap multiselect CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-multiselect@1.1.2/dist/css/bootstrap-multiselect.css">

<!-- Fallback critical styles in case external CSS fails -->
<style>
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  background: #f8f9fa; 
  line-height: 1.6; 
}
.container { 
  max-width: 980px; 
  background: white; 
  border-radius: 5px; 
  box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
  margin: 20px auto; 
  padding: 20px; 
}
.top-strip { 
  background: linear-gradient(to right, #0097e6, #00a8ff); 
  height: 5px; 
  margin-bottom: 20px; 
}
.deadline-border { 
  border-left: 4px solid #0097e6 !important; 
  margin-bottom: 20px; 
  padding: 15px; 
  background: #f8f9fa; 
  border-radius: 5px; 
}
.timer { 
  font-weight: bold; 
  color: #0097e6; 
}
.deadline-time { 
  font-size: 14px; 
  color: #666; 
}
h1 { 
  color: #333; 
  font-weight: 600; 
  margin-bottom: 20px; 
}
</style>

{% if site.github.environment == 'dotcom' %}
<link rel="shortcut icon" href="/deadlines/assets/img/favicon.png">
{% else %}
<link rel="shortcut icon" href="/assets/img/favicon.png">
{% endif %}

<!-- jQuery and Bootstrap from CDN -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-multiselect@1.1.2/dist/js/bootstrap-multiselect.min.js"></script>

<!-- Local scripts -->
{% if site.github.environment == 'dotcom' %}
<script type="text/javascript" src="/deadlines/assets/js/jquery.countdown.min.js"></script>
<script src="/deadlines/assets/js/store.min.js"></script>
<script src="/deadlines/assets/js/ouical.min.js"></script>
<script src="/deadlines/assets/js/js-year-calendar.js"></script>
{% else %}
<script type="text/javascript" src="/assets/js/jquery.countdown.min.js"></script>
<script src="/assets/js/store.min.js"></script>
<script src="/assets/js/ouical.min.js"></script>
<script src="/assets/js/js-year-calendar.js"></script>
{% endif %}
