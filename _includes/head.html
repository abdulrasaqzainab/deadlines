<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ site.author }}">
<link rel="stylesheet" type="text/css" href="{{ "/assets/css/bootstrap.min.css" | prepend:site.baseurl }}">

<link rel="stylesheet" type="text/css" href="{{ "/assets/css/calendar.css" | prepend:site.baseurl }}">
<link rel="stylesheet" type="text/css" href="{{ "/assets/css/js-year-calendar.min.css" | prepend:site.baseurl }}">
<link rel="shortcut icon" href="{{ "/assets/img/favicon.png" | prepend:site.baseurl }}">
<script type="text/javascript" src="{{ "/assets/js/jquery.min.js" | prepend:site.baseurl }}"></script>

<script type="text/javascript" src="{{ "/assets/js/popper.min.js" | prepend:site.baseurl }}"></script>
<script type="text/javascript" src="{{ "/assets/js/bootstrap-multiselect.min.js" | prepend:site.baseurl }}"></script>
