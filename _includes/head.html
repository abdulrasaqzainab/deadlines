<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ site.author }}">

<!-- Bootstrap CSS from CDN as fallback -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/css/deadlines.css?t={{site.time | date: '%s'}}" media="screen,projection">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/css/calendar.css">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/css/js-year-calendar.min.css">

<!-- Bootstrap multiselect CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-multiselect@1.1.2/dist/css/bootstrap-multiselect.css">

<link rel="shortcut icon" href="{{ site.baseurl }}/assets/img/favicon.png">

<!-- jQuery and Bootstrap from CDN -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-multiselect@1.1.2/dist/js/bootstrap-multiselect.min.js"></script>

<!-- Local scripts -->
<script type="text/javascript" src="{{ site.baseurl }}/assets/js/jquery.countdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/store.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/ouical.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/js-year-calendar.js"></script>
