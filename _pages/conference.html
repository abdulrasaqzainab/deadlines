---
permalink:  /conference/
---

<html>
  <head>
    {% include head.html %}
  </head>
  <body>
    <div class="top-strip"></div>
    <div class="container">
        <div class="page-header" id="conf-title">
            <div class="row">
                <div class="col-xs-12 col-sm-12">
                  <h1>
                    <a id="conf-title-href" nohref></a>
                    <span id="twitter-box"></span>
                  </h1>
                </div>
                <div class="meta deadline col-xs-12">
                  <div id="conf-fullname" class="conf-fullname"></div>
                  
                  <div class="conf-meta-line">
                    <span id="conf-date"></span>.
                  </div>
                  
                  <div class="conf-location">
                    <i>📍</i>
                    <span id="conf-place"></span>
                  </div>
                  
                  <div class="conf-meta-details">
                    <div id="conf-dates" class="conf-dates small" style="display:none;">
                      Start: <span id="conf-start"></span>. End: <span id="conf-end"></span>.
                    </div>
                    
                    <div id="conf-hindex" class="conf-hindex small" style="display:none;">
                      H-index: <strong id="hindex-value"></strong>
                    </div>
                  </div>
                  
                  <div class="deadline-container">
                    <div class="deadline">
                      <div><strong>Deadline:</strong> <span class="deadline-time"></span></div>
                      <div id="abstract-deadline" class="abstract-deadline small" style="display:none;">
                        Abstract Deadline: <span id="abstract-deadline-time"></span>
                      </div>
                    </div>
                  </div>
                  
                  <div class="mt-3">
                    <strong>Website:</strong> <a id="conf-website" target="_blank" nohref></a>
                  </div>
                  
                  <div id="conf-additional-links" class="conf-links small" style="display:none;">
                    <span id="papers-link" style="display:none;">
                      <a id="papers-link-href" target="_blank" nohref>Papers</a>
                    </span>
                    <span id="link-separator" style="display:none;"> | </span>
                    <span id="pwc-link" style="display:none;">
                      <a id="pwc-link-href" target="_blank" nohref>PWC</a>
                    </span>
                  </div>
                </div>
            </div>
        </div>
        <div>
          <div class="row">
              <div class="col-xs-12">
                <div class="text-center">
                  <span id="conf-timer" class="mt-3 mb-3"></span>
                </div>
                <br>
              </div>
          </div>
          <hr>
        </div>
        <footer>
          <a href="/">{{ site.domain }}</a> is maintained by <a href="http://www.vima.co.za/research/research-university-of-pretoria/">Data Science for Social Impact @ UP</a>.<br>
Join the MLDS Africa <a target="_blank" href="https://groups.google.com/d/forum/mlds-africa">Mailing List</a>.
        </footer>
    </div>
    <script type="text/javascript" charset="utf-8">
    $(function() {
        var url = new URL(window.location);
        var conf = url.searchParams.get('id');
        console.log(conf);

        // Borrowed from https://github.com/moment/moment-timezone/issues/167
        // Adds support for time zones 'UTC-12'..'UTC+12'
        function addUtcTimeZones() {
          // Moment.js uses the IANA timezone database, which supports generic time zones like 'Etc/GMT+1'.
          // However, the signs for these time zones are inverted compared to ISO 8601.
          // For more details, see https://github.com/moment/moment-timezone/issues/167
          for (let offset = -12; offset <= 12; offset++) {
            const posixSign = offset <= 0 ? '+' : '-';
            const isoSign = offset >= 0 ? '+' : '-';
            const link = `Etc/GMT${posixSign}${Math.abs(offset)}|UTC${isoSign}${Math.abs(offset)}`;
            moment.tz.link(link);
          }
        }
        
        // Helper function to get timezone with fallback
        function getSafeTimezone(timezone) {
          if (!timezone) return "America/New_York";
          
          // Check if it's a UTC timezone
          if (timezone.startsWith("UTC")) {
            return timezone;
          }
          
          try {
            // Test if the timezone is valid
            moment.tz(timezone);
            return timezone;
          } catch (e) {
            console.warn(`Invalid timezone: ${timezone}, falling back to America/New_York`);
            return "America/New_York";
          }
        }
        
        addUtcTimeZones();

        {% for conf in site.data.conferences %}
            if (conf == "{{ conf.id }}") {
              $('#conf-title-href').text("{{conf.title}} {{conf.year}}");
              $('#conf-title-href').attr('href', "/conference?id={{conf.id}}");
              $('#conf-date').text("{{conf.date}}");
              $('#conf-place').text("{{conf.place}}");
              $('#conf-website').text("{{conf.link}}");
              $('#conf-website').attr('href', "{{conf.link}}");
              
              // Display full name if available
              {% if conf.full_name %}
              $('#conf-fullname').text("{{conf.full_name}}").show();
              {% else %}
              $('#conf-fullname').hide();
              {% endif %}
              
              // Display start and end dates if available
              {% if conf.start and conf.end %}
              $('#conf-dates').show();
              $('#conf-start').text("{{conf.start}}");
              $('#conf-end').text("{{conf.end}}");
              {% endif %}
              
              // Display h-index if available
              {% if conf.hindex %}
              $('#conf-hindex').show();
              $('#hindex-value').text("{{conf.hindex}}");
              {% endif %}
              
              // Display abstract deadline if available
              {% if conf.abstract_deadline %}
              $('#abstract-deadline').show();
              var abstractTimezone = getSafeTimezone("{{conf.timezone}}");
              var abstractDate = moment.tz("{{conf.abstract_deadline}}", abstractTimezone);
              $('#abstract-deadline-time').text(abstractDate.toString());
              {% endif %}
              
              // Display additional links if available
              var hasAdditionalLinks = false;
              {% if conf.paperslink %}
              $('#papers-link').show();
              $('#papers-link-href').attr('href', "{{conf.paperslink}}").text("Papers");
              hasAdditionalLinks = true;
              {% else %}
              $('#papers-link').hide();
              {% endif %}
              
              {% if conf.pwclink %}
              $('#pwc-link').show();
              $('#pwc-link-href').attr('href', "{{conf.pwclink}}").text("PWC");
              hasAdditionalLinks = true;
              {% else %}
              $('#pwc-link').hide();
              {% endif %}
              
              if (hasAdditionalLinks) {
                $('#conf-additional-links').show();
                {% if conf.paperslink and conf.pwclink %}
                $('#link-separator').show();
                {% else %}
                $('#link-separator').hide();
                {% endif %}
              } else {
                $('#conf-additional-links').hide();
              }
              
              var twitter_slug = '<a href="https://twitter.com/share" class="twitter-share-button" data-text="Countdown to the #{{ conf.title }}{{ conf.year }} deadline!" data-show-count="false" style="font-size:13px;">Tweet</a><script async src="//platform.twitter.com/widgets.js" charset="utf-8">';
              $('#twitter-box').html(twitter_slug);
              {% if conf.deadline == "TBA" %}
                $('#conf-timer').html("TBA");
                $('.deadline-time').html("TBA");
              {% else %}
                // adjust date according to deadline timezone
                var timezone = getSafeTimezone("{{conf.timezone}}");
                var confDate = moment.tz("{{conf.deadline}}", timezone);

                // render countdown timer
                $('#conf-timer').countdown(confDate.toDate(), function(event) {
                  $(this).html(event.strftime('%D days %Hh %Mm %Ss'));
                });
                $('.deadline-time').html(confDate.toString());
              {% endif %}
            }
        {% endfor %}
    });
    // Google analytics
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
    ga('create', '{{ site.ga_id }}', 'auto');
    ga('send', 'pageview');
    </script>
  </body>
</html>
